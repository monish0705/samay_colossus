[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "samay-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "pydantic>=2.9,<3", "pydantic-settings>=2.6,<3", "SQLAlchemy>=2.0,<3", "alembic>=1.14,<2", "pandas>=2.2,<3", "numpy>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.14,<1"]
ml = ["scikit-learn>=1.5,<2", "lightgbm>=4.5,<5"]
forecast = ["scikit-learn>=1.5,<2"]
analysis = ["matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
