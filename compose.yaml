services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SAMAY_DATABASE_URL: sqlite:////app/runtime/samay.db
      SAMAY_ENVIRONMENT: production
      SAMAY_CORS_ORIGINS: '[]'
    volumes:
      - samay-runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      backend:
        condition: service_healthy
volumes:
  samay-runtime:
